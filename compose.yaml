# Hayat Ağı local dev stack
#
# Usage:
#   cp .env.example .env
#   docker compose up
#
# Services are added incrementally. See compose-services-status.md for what's
# wired and what's still planned.

services:
  mongo:
    image: mongo:7
    container_name: hayat-agi-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: hayat-agi
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-fusion:
    build:
      context: ../hayat-agi-ai/hayat-agi-fusion
    container_name: hayat-agi-ai-fusion
    restart: unless-stopped
    ports:
      - "${AI_FUSION_PORT:-8000}:8000"
    environment:
      # Defaults to real classifier; set CLASSIFIER_MOCK=true in .env for
      # fast dev iteration without HF Hub download.
      CLASSIFIER_MOCK: ${CLASSIFIER_MOCK:-false}
      # HF Hub model distribution. If HF_MODEL_REPO is empty AND no local
      # MODEL_PATH file is mounted, the service falls back to mock with a
      # warning (see ai/hayat-agi-fusion/app/model_loader.py).
      HF_MODEL_REPO: ${HF_MODEL_REPO:-}
      HF_MODEL_FILENAME: ${HF_MODEL_FILENAME:-multitask_v3.pt}
      HF_MODEL_REVISION: ${HF_MODEL_REVISION:-main}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /model-cache
      SCHEMA_PATH: /app/schemas/category_schema.json
      FUSION_INGEST_TOKEN: ${FUSION_INGEST_TOKEN:-}
    volumes:
      # Mount the canonical schema from this repo so ai-fusion always uses
      # the platform-vendored copy as the single source of truth.
      - ./schema/category_schema.json:/app/schemas/category_schema.json:ro
      # Cache HF Hub downloads so the 442 MB model is fetched once per host.
      - model-cache:/model-cache
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/healthz\").status==200 else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  fusion-forwarder:
    build:
      context: ./forwarder
    container_name: hayat-agi-fusion-forwarder
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/hayat-agi
      AI_FUSION_URL: http://ai-fusion:8000
      FUSION_INGEST_TOKEN: ${FUSION_INGEST_TOKEN:-}
      POLL_INTERVAL_MS: ${FORWARDER_POLL_MS:-5000}
    depends_on:
      mongo:
        condition: service_healthy
      ai-fusion:
        condition: service_healthy

  command-center-backend:
    build:
      context: ../hayat-agi-command-center/backend
    container_name: hayat-agi-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/hayat-agi
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AI_FUSION_URL: http://ai-fusion:8000
      FUSION_INGEST_TOKEN: ${FUSION_INGEST_TOKEN:-}
      PORT: 5000
    depends_on:
      mongo:
        condition: service_healthy
      ai-fusion:
        condition: service_healthy

  command-center-frontend:
    build:
      context: ../hayat-agi-command-center/hayat-agi-frontend
      args:
        # Vite inlines this at build time — changing it requires a rebuild.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    container_name: hayat-agi-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      command-center-backend:
        condition: service_started

volumes:
  mongo-data:
  model-cache:
