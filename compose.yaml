# Hayat Ağı local dev stack
#
# Usage:
#   cp .env.example .env
#   docker compose up
#
# Services are added incrementally. See compose-services-status.md for what's
# wired and what's still planned.

services:
  mongo:
    image: mongo:7
    container_name: hayat-agi-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: hayat-agi
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-fusion:
    build:
      context: ../hayat-agi-ai/hayat-agi-fusion
    container_name: hayat-agi-ai-fusion
    restart: unless-stopped
    ports:
      - "${AI_FUSION_PORT:-8000}:8000"
    environment:
      CLASSIFIER_MOCK: "true"
      SCHEMA_PATH: /app/schemas/category_schema.json
    volumes:
      # Mount the canonical schema from this repo so ai-fusion always uses
      # the platform-vendored copy as the single source of truth.
      - ./schema/category_schema.json:/app/schemas/category_schema.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/healthz\").status==200 else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data:
